name: Update Bayanath videos

# Refreshes the public video list from the official YouTube channel.
# The site is static, so the update also refreshes the HTML copies before publishing.
# Saturday 21:00 IST is 15:30 UTC: 30 15 * * 6.
# The public RSS feed is enough; YOUTUBE_API_KEY is optional and only used from a repository secret.
on:
  schedule:
    - cron: '30 15 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-bayanath
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # This job changes video data and its matching static HTML copies. Keep its test gate
      # focused on the updater; run the full site UI/content suite separately before broader releases.
      - name: Bayanath updater tests (simulated YouTube, no network)
        run: python3 -I -m unittest discover -s tools/tests -p 'test_update_bayanath.py' -v

      - name: Fetch, filter and verify videos
        id: update
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            if python3 tools/update_bayanath.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed; waiting $((attempt * 120)) seconds before trying again."
              sleep $((attempt * 120))
            fi
          done
          echo "::error::The Bayanath update failed 3 times. The published list was not changed."
          exit 1

      - name: Refresh static Bayanath pages
        if: steps.update.outputs.changed == 'true'
        run: python3 tools/refresh_bayanath_static.py

      - name: Commit if the list changed
        id: commit
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/bayanath-videos.json public/Bayanath.html public/MuftiMaqsoodImran.html
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update Bayanath videos from YouTube"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Optional: keep a separate cPanel-hosted copy in sync. Failure here must not block Pages.
      - name: Optional upload to cPanel
        if: steps.update.outputs.changed == 'true' && env.CPANEL_FTP_HOST != ''
        continue-on-error: true
        env:
          CPANEL_FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.CPANEL_FTP_DIR }}
          FTP_PORT: ${{ secrets.CPANEL_FTP_PORT }}
          FTP_TLS_VERIFY: ${{ secrets.CPANEL_FTP_TLS_VERIFY }}
        run: python3 tools/upload_to_host.py

      - name: Publish the new list (start the Pages deployment)
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh workflow run deploy-pages.yml --ref "${GITHUB_REF_NAME}"; then
            echo "::warning::The list was committed but deploy-pages.yml could not be started. Check its workflow_dispatch trigger, then start the deployment from the Actions tab."
            exit 1
          fi
